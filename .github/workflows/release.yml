name: Release

# When a version tag (v1.4.0 ...) is pushed: build AltHub.exe on a clean Windows runner and attach it to the release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile AltHub.exe
        shell: pwsh
        run: |
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:windir\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:winexe /optimize+ /debug- /warn:1 `
            /nowarn:0168,0219,0414,0649,0169,0067 `
            /out:AltHub.exe /win32icon:app.ico /win32manifest:app.manifest `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            /r:System.Web.Extensions.dll /r:System.Net.Http.dll /r:System.Security.dll /r:System.Management.dll `
            /recurse:src\*.cs
          if (-not (Test-Path AltHub.exe)) { Write-Error "Build produced no exe"; exit 1 }
          Get-FileHash AltHub.exe -Algorithm SHA256 | Tee-Object -FilePath AltHub.exe.sha256.txt

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v" + (Get-Content VERSION).Trim() }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item AltHub.exe, app.ico, LICENSE, README.md, CHANGELOG.md pkg\
          Compress-Archive -Path pkg\* -DestinationPath "AltHub-$tag-windows.zip" -Force
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title "AltHub $env:TAG" --notes-file CHANGELOG.md }
          gh release upload $env:TAG "AltHub-$env:TAG-windows.zip" AltHub.exe AltHub.exe.sha256.txt --clobber
